name: CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    uses: rizuke/.github/.github/workflows/build-docker-image.yaml@main
    with:
      image-name: rizuke-dev
      context: .
      dockerfile: ./Dockerfile
      multi-arch: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write